<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP First Stats — Sign in</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-slate-900 rounded-xl p-6 shadow-xl">
    <img src="/images/lpfirst.webp" alt="LP First" class="h-10 mx-auto mb-4" onerror="this.remove()">
    <h1 id="title" class="text-xl font-semibold text-center mb-4">Sign in</h1>
    <p id="error" class="hidden text-red-400 text-sm mb-3"></p>
    <form id="form" class="space-y-3">
      <input id="name" type="text" placeholder="Name" class="hidden w-full rounded bg-slate-800 border border-slate-700 px-3 py-2">
      <input id="email" type="email" placeholder="Email" required class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2">
      <input id="password" type="password" placeholder="Password" required minlength="8" class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2">
      <button class="w-full rounded bg-indigo-600 hover:bg-indigo-500 py-2 font-medium">Continue</button>
    </form>
    <button id="toggle" class="mt-4 text-sm text-slate-400 hover:text-slate-200 w-full text-center">Need an account? Sign up</button>
  </div>
<script>
let mode = "signin";
const $ = (id) => document.getElementById(id);

$("toggle").onclick = () => {
  mode = mode === "signin" ? "signup" : "signin";
  $("name").classList.toggle("hidden", mode === "signin");
  $("title").textContent = mode === "signin" ? "Sign in" : "Create account";
  $("toggle").textContent = mode === "signin" ? "Need an account? Sign up" : "Have an account? Sign in";
};

$("form").onsubmit = async (e) => {
  e.preventDefault();
  $("error").classList.add("hidden");
  const body = { email: $("email").value, password: $("password").value };
  let path = "/api/auth/sign-in/email";
  if (mode === "signup") {
    body.name = $("name").value || body.email.split("@")[0];
    path = "/api/auth/sign-up/email";
  }
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    $("error").textContent = data.message || "Authentication failed";
    $("error").classList.remove("hidden");
    return;
  }
  // If we arrived here mid-OAuth (MCP client flow), resume the authorize
  // request with the original query string; otherwise go to the dashboard.
  const qs = location.search;
  if (qs && new URLSearchParams(qs).has("client_id")) {
    location.href = "/api/auth/mcp/authorize" + qs;
  } else {
    location.href = "/";
  }
};
</script>
</body>
</html>
